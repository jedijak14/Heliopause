name: Attach verified source archive
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source-preview release tag
        required: true
        default: v0.5.0-source-preview
permissions:
  contents: write
jobs:
  source-archive:
    if: github.event_name == 'workflow_dispatch' || endsWith(github.event.release.tag_name, '-source-preview')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test portable rules and assets (not Unreal)
        run: bash Tools/test.sh
      - name: Package committed source and checksums
        run: python3 Tools/package_source.py --tag "$RELEASE_TAG"
      - name: Attach source-only release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "Artifacts/Heliopause-$RELEASE_TAG.zip" "Artifacts/Heliopause-$RELEASE_TAG.zip.sha256" --clobber
