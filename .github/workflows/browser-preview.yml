name: HTML preview checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BrowserPreview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: BrowserPreview/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify committed standalone output is reproducible
        run: git diff --exit-code -- heliopause.html heliopause.html.sha256
      - run: npm run test:browser
